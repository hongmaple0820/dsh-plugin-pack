<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dsh-cicd demo</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center;
             font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { max-width: 34rem; padding: 2rem; }
      code { background: #8881; padding: 0.1em 0.35em; border-radius: 4px; }
      h1 { margin: 0 0 0.6rem; font-size: 1.35rem; }
      dl { display: grid; grid-template-columns: auto 1fr; gap: 0.35rem 0.9rem; margin: 1rem 0 0; }
      dt { color: #888; }
      dd { margin: 0; }
    </style>
  </head>
  <body>
    <main>
      <h1>dsh-cicd 部署成功</h1>
      <p>这页是 <code>examples/demo-site</code> 打出来的，每次发布会换一个新的 release id。</p>
      <dl>
        <dt>release</dt><dd><code>{{RELEASE_ID}}</code></dd>
        <dt>commit</dt><dd><code>{{COMMIT}}</code></dd>
        <dt>built at</dt><dd><code>{{BUILT_AT}}</code></dd>
      </dl>
    </main>
  </body>
</html>
